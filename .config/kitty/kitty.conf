# ─── Kitty Terminal Configuration ────────────────────────────────
# Aesthetic: Last Horizon (Omarchy)
# Author: DDreamer01

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

# Window padding & opacity
window_padding_width 12 14
confirm_os_window_close 0
remember_window_size  no
initial_window_width  960
initial_window_height 600

background_opacity 0.92
# Blur is rendered by Hyprland (decoration > blur), not kitty
dynamic_background_opacity yes

# Cursor
cursor #e2dddc
cursor_text_color #0c0b0c
# Cursor smooth trail (the same "flowy cursor" you run via smooth-cursor in Neovim)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_beam_thickness 1.8
cursor_blink_interval 0.5

# Mouse & URL
mouse_hide_wait 3.0
url_color #c38b7b
url_style curly
open_url_with default

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Colors (Last Horizon)
background #0c0b0c
foreground #FAFCFB
selection_background #433b3e
selection_foreground #FAFCFB

# ANSI Colors
color0  #0c0b0c
color1  #c38b7b
color2  #87a9b0
color3  #6B5E73
color4  #b59790
color5  #c4d8e2
color6  #a5a0b6
color7  #cfd3cd

color8  #584e51
color9  #c38b7b
color10 #87a9b0
color11 #6B5E73
color12 #b59790
color13 #c4d8e2
color14 #a5a0b6
color15 #e2dddc

# Tmux compatibility
term xterm-256color

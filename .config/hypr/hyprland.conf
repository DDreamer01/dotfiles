# ==============================================================================
#  DDreamer01's Crimson-Minimalist Hyprland Configuration
#  Optimized for NVIDIA Quadro T2000 (Turing) & Kali/Debian Linux
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Monitor Setup
# ------------------------------------------------------------------------------
monitor=,preferred,auto,1

# ------------------------------------------------------------------------------
# 2. NVIDIA Quadro T2000 (Turing) Hardware Acceleration & Wayland Flags
# ------------------------------------------------------------------------------
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Wayland environment variables for common toolkits
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

# Cursor settings (Prevents invisible/flickering cursor on NVIDIA drivers)
cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

# ------------------------------------------------------------------------------
# 3. Autostart Applications & Daemons
# ------------------------------------------------------------------------------
exec-once = waybar
exec-once = swaync
exec-once = hyprpaper
exec-once = hypridle
exec-once = /usr/libexec/hyprpolkitagent || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard persistence
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ------------------------------------------------------------------------------
# 4. Input Configuration
# ------------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ------------------------------------------------------------------------------
# 5. General Layout & Window Aesthetics (Last Horizon)
# ------------------------------------------------------------------------------
general {
    # border colors unused — border_size = 0 (borders removed)
    # col.active_border   = rgba(e2dddc99)   # ghost silver
    # col.inactive_border = rgba(797b8044)
    gaps_in = 4
    gaps_out = 8
    border_size = 0

    layout = dwindle
    allow_tearing = false
}

# ------------------------------------------------------------------------------
# 6. Decoration & Frosted Acrylic Blur (Last Horizon)
# ------------------------------------------------------------------------------
decoration {
    rounding = 6

    active_opacity = 0.98
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        vibrancy = 0.1696
        ignore_opacity = true
    }

    shadow {
        enabled = yes
        render_power = 6
        range = 20
        color = rgba(05080a99)
    }
}

# ------------------------------------------------------------------------------
# 7. Fluid Damped Physics Animations (Last Horizon Spring / Decel)
# ------------------------------------------------------------------------------
animations {
    enabled = true

    bezier = expressiveFastSpatial, 0.42, 1.67, 0.21, 0.90
    bezier = expressiveSlowSpatial, 0.39, 1.29, 0.35, 0.98
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.52, 0.03, 0.72, 0.08

    animation = windowsIn, 1, 3, emphasizedDecel, popin 80%
    animation = windowsOut, 1, 2, emphasizedDecel, popin 90%
    animation = windowsMove, 1, 3, emphasizedDecel, slide
    animation = border, 1, 10, emphasizedDecel
    animation = workspaces, 1, 7, menu_decel, slide
}

# ------------------------------------------------------------------------------
# 8. Window Rules & Floating Windows (Windowrulev2 for Hyprland 0.56+)
# ------------------------------------------------------------------------------
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# Floating modal windows
windowrule = float on, match:class ^pavucontrol$
windowrule = float on, match:class ^blueman-manager$
windowrule = float on, match:class ^nm-connection-editor$
windowrule = float on, match:class ^swappy$
windowrule = float on, match:class ^wlogout$
windowrule = float on, match:title ^Open File$
windowrule = float on, match:title ^Save File$
windowrule = float on, match:title ^branchdialog$

# Opacity overrides for clean readability
windowrule = opacity 0.96 0.92, match:class ^kitty$
windowrule = opacity 1.0 1.0, match:class ^firefox$

# ------------------------------------------------------------------------------
# 9. Keybindings (Vim-Ergonomic & Raycast-Style)
# ------------------------------------------------------------------------------
$mainMod = SUPER

# Core App Launchers
bind = $mainMod, Return, exec, kitty
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, K, exec, ~/.config/hypr/scripts/keybinds.sh
bind = $mainMod SHIFT, Return, exec, firefox
bind = $mainMod SHIFT, F, exec, thunar || nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod, E, exec, thunar || nautilus
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, Escape, exec, ~/.config/hypr/scripts/powermenu.sh

# Clipboard History Picker
bind = $mainMod SHIFT, V, exec, cliphist list | rofi -dmenu -i -theme ~/.config/rofi/lasthorizon.rasi -p 'Clipboard...' | cliphist decode | wl-copy

# Wallpaper Cycling & Workspace Cycling
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh cycle
bind = $mainMod, Tab, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Window Controls
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, T, layoutmsg, togglesplit

# Vim-Style Window Navigation (Super + H/J/L — K is reserved for the cheatsheet)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, d

# Vim-Style Window Movement (Super + Shift + H/J/K/L)
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize Windows (Super + Alt + H/J/K/L)
binde = $mainMod ALT, H, resizeactive, -20 0
binde = $mainMod ALT, L, resizeactive, 20 0
binde = $mainMod ALT, K, resizeactive, 0 -20
binde = $mainMod ALT, J, resizeactive, 0 20

# Switch Workspaces (Super + 1..9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
# Workspaces 6-9 disabled: 5 is enough
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace (Super + Shift + 1..9)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
# Workspaces 6-9 disabled: 5 is enough
# bind = $mainMod SHIFT, 6, movetoworkspace, 6
# bind = $mainMod SHIFT, 7, movetoworkspace, 7
# bind = $mainMod SHIFT, 8, movetoworkspace, 8
# bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Window Actions (Move / Resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (Grim + Slurp + wl-copy)
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = $mainMod, Print, exec, ~/.config/hypr/scripts/screenshot.sh full
bind = $mainMod SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh active

# Hardware Media Keys (Volume & Brightness)
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh +5%
bindle = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh -5%

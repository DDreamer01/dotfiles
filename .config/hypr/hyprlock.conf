# ==============================================================================
#  Catppuccin Mocha Hyprlock Configuration
# ==============================================================================

background {
    monitor =
    path = /home/dreamer/.config/hypr/wallpapers/lasthorizon_BG1.jpeg
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# Avatar / Icon
label {
    monitor =
    text = 󰌾
    color = rgba(255, 255, 255, 0.9)
    font_size = 50
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# Time (Hours:Minutes)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(230, 230, 230, 0.95)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 15
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(195, 139, 123, 1)
    inner_color = rgba(12, 11, 12, 0.66)
    font_color = rgba(226, 221, 220, 1)
    check_color = rgba(181, 151, 144, 1)
    fail_text = <span foreground="##c38b7b">Wrong password</span>
    fail_color = rgba(195, 139, 123, 1)
    fade_on_empty = false
    placeholder_text = <span foreground="##797b80">Enter Password...</span>
    hide_input = false
    position = 0, -65
    halign = center
    valign = center
}
